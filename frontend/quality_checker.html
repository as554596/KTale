<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>KTale - 漏翻校對</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }

        h1 {
            color: #667eea;
            margin-bottom: 10px;
            font-size: 28px;
        }

        .stats-bar {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            padding: 20px;
            border-radius: 15px;
            margin: 20px 0;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
        }

        .stat-item {
            text-align: center;
        }

        .stat-value {
            font-size: 32px;
            font-weight: bold;
            display: block;
        }

        .stat-label {
            font-size: 14px;
            opacity: 0.9;
            margin-top: 5px;
        }

        .filter-bar {
            display: flex;
            gap: 10px;
            margin: 20px 0;
            flex-wrap: wrap;
        }

        .filter-btn {
            padding: 10px 20px;
            border: 2px solid #667eea;
            background: white;
            color: #667eea;
            border-radius: 20px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.3s;
        }

        .filter-btn.active {
            background: #667eea;
            color: white;
        }

        .action-bar {
            display: flex;
            gap: 10px;
            margin: 20px 0;
            flex-wrap: wrap;
        }

        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 500;
            transition: all 0.3s;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
        }

        .btn-secondary {
            background: #f0f0f0;
            color: #333;
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .paragraph-list {
            margin-top: 20px;
        }

        .paragraph-item {
            background: #f8f9fa;
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 15px;
            border-left: 5px solid #667eea;
            transition: all 0.3s;
        }

        .paragraph-item.low-quality {
            border-left-color: #ff6b6b;
            background: #fff5f5;
        }

        .paragraph-item.selected {
            background: #e7f3ff;
            border-left-color: #2196F3;
        }

        .paragraph-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .paragraph-index {
            font-weight: bold;
            color: #667eea;
            font-size: 16px;
        }

        .confidence-badge {
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
        }

        .confidence-high {
            background: #d4edda;
            color: #155724;
        }

        .confidence-medium {
            background: #fff3cd;
            color: #856404;
        }

        .confidence-low {
            background: #f8d7da;
            color: #721c24;
        }

        .paragraph-content {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin: 15px 0;
        }

        @media (max-width: 768px) {
            .paragraph-content {
                grid-template-columns: 1fr;
            }
        }

        .text-box {
            padding: 15px;
            background: white;
            border-radius: 10px;
            border: 2px solid #e0e0e0;
        }

        .text-box label {
            display: block;
            font-weight: bold;
            margin-bottom: 8px;
            color: #555;
            font-size: 14px;
        }

        .text-box textarea {
            width: 100%;
            min-height: 100px;
            border: none;
            resize: vertical;
            font-size: 15px;
            line-height: 1.6;
            font-family: inherit;
        }

        .text-box textarea:focus {
            outline: none;
        }

        .text-box.original textarea {
            background: #f9f9f9;
            color: #666;
        }

        .paragraph-actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .btn-small {
            padding: 8px 16px;
            font-size: 14px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-retry {
            background: #667eea;
            color: white;
        }

        .btn-save {
            background: #51cf66;
            color: white;
        }

        .btn-select {
            background: #f0f0f0;
            color: #333;
        }

        .btn-select.selected {
            background: #2196F3;
            color: white;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #667eea;
            font-size: 18px;
        }

        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #999;
        }

        .empty-state svg {
            width: 100px;
            height: 100px;
            margin-bottom: 20px;
            opacity: 0.5;
        }

        .checkbox {
            width: 20px;
            height: 20px;
            cursor: pointer;
        }

        .toast {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: #333;
            color: white;
            padding: 15px 25px;
            border-radius: 10px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.3);
            opacity: 0;
            transform: translateY(20px);
            transition: all 0.3s;
            z-index: 1000;
        }

        .toast.show {
            opacity: 1;
            transform: translateY(0);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📝 漏翻校對</h1>
        <p style="color: #666; margin-bottom: 20px;">檢查並修復翻譯中的問題段落</p>

        <!-- 統計信息 -->
        <div class="stats-bar" id="statsBar" style="display: none;">
            <div class="stats-grid">
                <div class="stat-item">
                    <span class="stat-value" id="totalCount">0</span>
                    <span class="stat-label">總段落</span>
                </div>
                <div class="stat-item">
                    <span class="stat-value" id="lowQualityCount">0</span>
                    <span class="stat-label">低質量</span>
                </div>
                <div class="stat-item">
                    <span class="stat-value" id="retriedCount">0</span>
                    <span class="stat-label">已重試</span>
                </div>
                <div class="stat-item">
                    <span class="stat-value" id="qualityPercent">0%</span>
                    <span class="stat-label">質量率</span>
                </div>
            </div>
        </div>

        <!-- 篩選器 -->
        <div class="filter-bar" id="filterBar" style="display: none;">
            <button class="filter-btn active" data-filter="all">全部</button>
            <button class="filter-btn" data-filter="low">僅顯示問題段落</button>
            <button class="filter-btn" data-filter="high">僅顯示正常段落</button>
        </div>

        <!-- 批量操作 -->
        <div class="action-bar" id="actionBar" style="display: none;">
            <button class="btn btn-primary" id="batchRetryBtn" disabled>批量重譯選中段落</button>
            <button class="btn btn-secondary" id="saveAllBtn">保存全部修改</button>
            <button class="btn btn-secondary" id="downloadBtn">下載修正後的文件</button>
            <span id="selectedCount" style="margin-left: 10px; color: #666;"></span>
        </div>

        <!-- 加載狀態 -->
        <div class="loading" id="loading">
            <div class="spinner"></div>
            <p>加載質量報告中...</p>
        </div>

        <!-- 段落列表 -->
        <div class="paragraph-list" id="paragraphList"></div>

        <!-- 空狀態 -->
        <div class="empty-state" id="emptyState" style="display: none;">
            <svg viewBox="0 0 24 24" fill="currentColor">
                <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"/>
            </svg>
            <h3>沒有找到質量報告</h3>
            <p>請先完成翻譯任務</p>
        </div>
    </div>

    <!-- Toast 通知 -->
    <div class="toast" id="toast"></div>

    <script src="quality_checker.js"></script>
</body>
</html>
